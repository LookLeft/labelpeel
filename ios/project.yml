# Generate the Xcode project with XcodeGen (brew install xcodegen), from this
# folder: `xcodegen`. ./build-web.sh does both steps.
name: Labelpeel
options:
  bundleIdPrefix: com.lookleft
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Labelpeel:
    type: application
    platform: iOS
    sources:
      - path: Labelpeel
      # The built web app (copied from ../dist by build-web.sh), bundled as a
      # folder so its relative paths stay intact.
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lookleft.labelpeel
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JK8FC72ZE9
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Labelpeel/Info.plist
      properties:
        CFBundleDisplayName: Labelpeel
        # From the build settings, so CI can set the release version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Brother's printer command protocol over Apple's External Accessory
        # framework (Bluetooth Classic printers are MFi accessories on iOS).
        UISupportedExternalAccessoryProtocols:
          - com.brother.ptcbp
        NSBluetoothAlwaysUsageDescription: Labelpeel connects to your label printer over Bluetooth to print your designs.
