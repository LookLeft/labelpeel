name: macOS

# Builds the Mac app on every push and pull request (ad-hoc signed, to catch
# build errors), and is reused by the release workflow, which signs it with the
# Developer ID certificate, notarizes it with Apple and attaches a .dmg.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version name, e.g. 1.2.0
        type: string
        required: false
      release:
        description: Sign and notarize
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      # Matches the Sparkle package version in macos/project.yml.
      SPARKLE_VERSION: 2.10.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: brew install xcodegen
      - name: Version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          else
            # The web app shows package.json's version (About dialog), so match the release.
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          # Minutes since 1970: always increases between builds.
          echo "build=$(( $(date +%s) / 60 ))" >> "$GITHUB_OUTPUT"

      - name: Build the web app into the Mac app
        run: macos/build-web.sh

      - name: Import the Developer ID certificate
        if: inputs.release && env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Apple's Developer ID intermediate, so codesign can build the chain.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # Sign with the certificate's own team, e.g. "Developer ID Application: Name (TEAMID)".
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: .*"' | head -1 | tr -d '"')"
          TEAM="$(echo "$IDENTITY" | sed -E 's/.*\(([A-Z0-9]+)\)$/\1/')"
          if [ -z "$TEAM" ]; then echo "::error::No Developer ID Application identity in the imported certificate."; exit 1; fi
          echo "Signing as $IDENTITY"
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          echo "SIGNED=1" >> "$GITHUB_ENV"
      - name: No signing certificate
        if: inputs.release && env.MACOS_CERTIFICATE_BASE64 == ''
        run: echo "::warning::MACOS_CERTIFICATE_BASE64 is not set, so the Mac app is not signed or notarized. macOS will warn when opening it."

      - name: Build
        run: |
          if [ "$SIGNED" = 1 ]; then
            # No get-task-allow (debugger) entitlement, which notarization rejects;
            # xcodebuild adds it to plain "build" products by default.
            SIGNING=(CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Developer ID Application" "DEVELOPMENT_TEAM=$TEAM_ID" "OTHER_CODE_SIGN_FLAGS=--timestamp" CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO)
          else
            SIGNING=(CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          fi
          xcodebuild -project macos/LabelpeelMac.xcodeproj -scheme Labelpeel -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            "${SIGNING[@]}" build
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/dd/Build/Products/Release/Labelpeel.app"
          # Runs on Apple silicon and Intel Macs.
          lipo -archs "$RUNNER_TEMP/dd/Build/Products/Release/Labelpeel.app/Contents/MacOS/Labelpeel"

      - name: Package
        run: |
          DMG="Labelpeel-${{ steps.version.outputs.name }}.dmg"
          mkdir -p "$RUNNER_TEMP/dmg"
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release/Labelpeel.app" "$RUNNER_TEMP/dmg/"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname Labelpeel -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "$DMG"
          if [ "$SIGNED" = 1 ]; then codesign --sign "Developer ID Application" --timestamp "$DMG"; fi
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize
        if: env.SIGNED == '1' && env.APPLE_API_KEY_BASE64 != ''
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          AUTH=(--key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          ID="$(plutil -extract id raw "$RUNNER_TEMP/notary.json")"
          STATUS="$(plutil -extract status raw "$RUNNER_TEMP/notary.json")"
          if [ "$STATUS" != "Accepted" ]; then
            # Apple's reasons for rejecting it.
            xcrun notarytool log "$ID" "${AUTH[@]}"
            echo "::error::Notarization $STATUS. See Apple's log above."
            exit 1
          fi
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"
          rm "$RUNNER_TEMP/AuthKey.p8"

      - name: Update feed
        # appcast.xml tells installed copies about this version; it's attached
        # to the release, and the app checks the latest release's copy.
        if: inputs.release && env.SPARKLE_PRIVATE_KEY != ''
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" -o sparkle.tar.xz
          mkdir sparkle && tar -xJf sparkle.tar.xz -C sparkle
          echo "$SPARKLE_PRIVATE_KEY" > sparkle.key
          mkdir feed && cp "$GITHUB_WORKSPACE/$DMG" feed/
          V="${{ steps.version.outputs.name }}"
          sparkle/bin/generate_appcast --ed-key-file sparkle.key \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v$V/" \
            --link "https://github.com/${{ github.repository }}/releases/tag/v$V" \
            -o "$GITHUB_WORKSPACE/appcast.xml" feed
          rm sparkle.key
      - name: No update key
        if: inputs.release && env.SPARKLE_PRIVATE_KEY == ''
        run: echo "::warning::SPARKLE_PRIVATE_KEY is not set, so this release has no appcast.xml and installed copies won't be offered it as an update."

      - uses: actions/upload-artifact@v4
        with:
          name: labelpeel-macos
          path: |
            Labelpeel-*.dmg
            appcast.xml
          if-no-files-found: error
