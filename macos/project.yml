# macOS app. Generate the Xcode project with XcodeGen (brew install xcodegen),
# from this folder: `xcodegen`. ./build-web.sh does both steps.
name: LabelsmithMac
options:
  bundleIdPrefix: com.alexbrazier
  deploymentTarget:
    macOS: "13.0"
packages:
  # Automatic updates from GitHub releases.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Keep in step with SPARKLE_VERSION in .github/workflows/macos.yml.
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Labelsmith:
    type: application
    platform: macOS
    sources:
      - path: Labelsmith
      # Shared with the iOS app.
      - path: ../ios/Labelsmith/BundleSchemeHandler.swift
      # The built web app (copied from ../dist by build-web.sh).
      - path: Web
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
    postBuildScripts:
      - name: Prepare Sparkle
        basedOnDependencyAnalysis: false
        script: |
          # Sparkle's XPC services are only for sandboxed apps, and this one isn't.
          # Its other helpers come ad-hoc signed, which notarization rejects, so
          # sign them like the app, inside out. Xcode signs the app itself after this.
          [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] || exit 0
          F="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          rm -rf "$F/XPCServices" "$F/Versions/B/XPCServices"
          SIGN=(codesign -f -s "$EXPANDED_CODE_SIGN_IDENTITY" -o runtime $OTHER_CODE_SIGN_FLAGS)
          "${SIGN[@]}" "$F/Versions/B/Autoupdate"
          "${SIGN[@]}" "$F/Versions/B/Updater.app"
          "${SIGN[@]}" "$F"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexbrazier.labelsmith.mac
        PRODUCT_NAME: Labelsmith
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: JK8FC72ZE9
        ENABLE_HARDENED_RUNTIME: YES
        # The Prepare Sparkle script edits the embedded framework.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Labelsmith/Info.plist
      properties:
        CFBundleDisplayName: Labelsmith
        # From the build settings, so CI can set the release version.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSBluetoothAlwaysUsageDescription: Labelsmith connects to your label printer over Bluetooth to print your designs.
        NSHumanReadableCopyright: Labelsmith is not affiliated with Brother Industries, Ltd.
        # Updates: each release attaches an appcast.xml for its version, and
        # GitHub's "latest" link always points at the newest one.
        SUFeedURL: https://github.com/alexbrazier/labelsmith/releases/latest/download/appcast.xml
        # Updates must be signed with the matching private key (SPARKLE_PRIVATE_KEY secret).
        SUPublicEDKey: 6DNBuuJ4QDkBBNsnIZe/u589/wF+oqBc2Vh5xcxoWdQ=
        SUEnableAutomaticChecks: true
