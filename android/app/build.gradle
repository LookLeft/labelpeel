plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set from repository
// secrets in CI). Without them the release APK is signed with the debug key,
// which installs fine but can't update an APK signed with a different key.
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')

android {
    namespace 'com.alexbrazier.labelsmith'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alexbrazier.labelsmith'
        minSdk 26
        targetSdk 35
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName project.findProperty('versionName') ?: '0.1.0'
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
